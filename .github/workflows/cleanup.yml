name: Cleanup PR Preview
on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: |
          pip install poetry
          poetry install

      - name: Delete Preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          poetry run mike delete --push --deploy-prefix pr ${{ github.event.number }}
